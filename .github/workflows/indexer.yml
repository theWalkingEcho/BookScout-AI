name: Bookstore Indexer

on:
  schedule:
    # Incremental update every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
    # Full database refresh on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Clear database and perform full refresh (True) or incremental update (False)'
        required: true
        type: boolean
        default: false

jobs:
  index:
    name: Run Bookstore Indexer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'indexer/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r indexer/requirements.txt

      - name: Run Indexer
        working-directory: indexer
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORE_CONFIGS_JSON: ${{ secrets.STORE_CONFIGS_JSON }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
              echo "==> Manual Trigger: Running FULL REFRESH (clearing database)..."
              python run_indexer.py --full-refresh
            else
              echo "==> Manual Trigger: Running INCREMENTAL update..."
              python run_indexer.py
            fi
          elif [ "${{ github.event.schedule }}" = "0 0 1 * *" ]; then
            echo "==> Monthly Cron: Running FULL REFRESH (clearing database)..."
            python run_indexer.py --full-refresh
          else
            echo "==> Weekly Cron: Running INCREMENTAL update..."
            python run_indexer.py
          fi
